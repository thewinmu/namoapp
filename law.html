<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>กฎระเบียบกลุ่ม - ครอบครัวนะโมพุทธายะ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { background-color: #f8fafc; font-family: 'Sukhumvit Set', 'Kanit', sans-serif; }
  </style>
</head>
<body class="max-w-md mx-auto bg-slate-50 min-h-screen pb-12 shadow-lg relative">

  <!-- Header -->
  <header class="bg-emerald-600 text-white p-4 sticky top-0 z-50 shadow-md flex items-center justify-between">
    <div class="flex items-center space-x-2">
      <i class="fa-solid fa-scroll text-xl"></i>
      <h1 class="font-bold text-lg">กฎระเบียบกลุ่มนะโมพุทธายะ</h1>
    </div>
  </header>

  <!-- Notification Toast -->
  <div id="toast" class="hidden fixed top-16 left-1/2 -translate-x-1/2 bg-gray-800 text-white text-xs px-4 py-2 rounded-full shadow-xl z-50 flex items-center space-x-2">
    <i id="toast-icon" class="fa-solid fa-circle-info"></i>
    <span id="toast-message">แจ้งเตือน</span>
  </div>

  <main class="p-4 space-y-4">
    <!-- Card แสดงเนื้อหากฎกลุ่ม -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 space-y-4">
      <div class="flex justify-between items-center border-b pb-2 border-gray-100">
        <span class="text-xs font-bold text-emerald-600 uppercase tracking-wider">
          <i class="fa-solid fa-circle-info mr-1"></i> ข้อปฏิบัติประจำกลุ่ม
        </span>
        <button onclick="copyRules()" class="text-xs text-gray-500 hover:text-emerald-600 font-medium">
          <i class="fa-solid fa-copy mr-1"></i> คัดลอก
        </button>
      </div>

      <!-- Loading State -->
      <div id="loading" class="text-center py-8 text-gray-400 text-xs">
        <i class="fa-solid fa-circle-notch fa-spin text-xl text-emerald-500 mb-2 block"></i>
        กำลังโหลดข้อมูลกฎระเบียบ...
      </div>

      <!-- Content State -->
      <div id="rulesContent" class="hidden text-xs leading-relaxed text-gray-700 whitespace-pre-wrap font-sans"></div>

      <!-- Action Buttons -->
      <div class="pt-2">
       
      </div>
    </div>
  </main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwv8AaKJKjDKqGncaNpHziDx7KWmBsjRWmtUTBiPXnh_0t74WSlhehFDOu2q40HhV7zfQ/exec"; // Web App URL ของคุณ
    const LIFF_ID = "2012072125-RXgWMeiV";

    document.addEventListener("DOMContentLoaded", function() {
      initLiff();
      loadRules();
    });

    async function initLiff() {
      try {
        await liff.init({ liffId: LIFF_ID });
      } catch (err) {
        console.log("LIFF Init Error or Running in Web Browser");
      }
    }

    async function loadRules() {
      try {
        const res = await fetch(`${API_URL}?action=getRules`);
        const data = await res.json();
        if(data.status === 'success') {
          document.getElementById('loading').classList.add('hidden');
          const content = document.getElementById('rulesContent');
          content.innerText = data.text;
          content.classList.remove('hidden');
        }
      } catch(e) {
        document.getElementById('loading').innerText = "ไม่สามารถโหลดข้อมูลได้ กรุณาลองใหม่อีกครั้ง";
      }
    }

    function showToast(msg, isSuccess = true) {
      const toast = document.getElementById('toast');
      const icon = document.getElementById('toast-icon');
      document.getElementById('toast-message').innerText = msg;
      icon.className = isSuccess ? 'fa-solid fa-circle-check text-emerald-400' : 'fa-solid fa-triangle-exclamation text-rose-400';
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 3000);
    }

    function copyRules() {
      const text = document.getElementById('rulesContent').innerText;
      navigator.clipboard.writeText(text).then(() => {
        showToast("คัดลอกกฎกลุ่มเรียบร้อยแล้วค่ะ");
      });
    }

    async function shareRules() {
      const text = document.getElementById('rulesContent').innerText;

      if (typeof liff !== 'undefined' && liff.isLoggedIn && liff.isLoggedIn() && liff.isApiAvailable('shareTargetPicker')) {
        try {
          await liff.shareTargetPicker([
            {
              "type": "flex",
              "altText": "📌 กฎระเบียบของกลุ่มนะโมพุทธายะ",
              "contents": {
                "type": "bubble",
                "size": "mega",
                "header": {
                  "type": "box", "layout": "vertical", "backgroundColor": "#06C755", "paddingAll": "12px",
                  "contents": [{ "type": "text", "text": "📌 กฎระเบียบประจำกลุ่ม", "weight": "bold", "color": "#FFFFFF", "size": "sm", "align": "center" }]
                },
                "body": {
                  "type": "box", "layout": "vertical", "paddingAll": "15px",
                  "contents": [{ "type": "text", "text": text, "wrap": true, "size": "xs", "color": "#333333", "lineSpacing": "5px" }]
                }
              }
            }
          ]);
          showToast("แชร์เรียบร้อยแล้ว");
          return;
        } catch (e) {}
      }

      // Fallback สำหรับ PC / Browser
      navigator.clipboard.writeText("📌 กฎระเบียบประจำกลุ่มนะโมพุทธายะ\n\n" + text).then(() => {
        showToast("คัดลอกข้อความกฎกลุ่มสำหรับแชร์เรียบร้อย");
      });
    }
  </script>
</body>
</html>
