<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ข้อปฏิบัติประจำกลุ่ม</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white w-full max-w-md rounded-2xl shadow-lg p-6 space-y-5 border border-slate-100">
    <div class="flex items-center justify-between border-b pb-3">
      <div class="flex items-center space-x-2 text-emerald-600">
        <i class="fa-solid fa-circle-info text-lg"></i>
        <h1 class="font-bold text-slate-800 text-lg">ข้อปฏิบัติประจำกลุ่ม</h1>
      </div>
      <button onclick="copyRules()" class="text-xs font-semibold text-slate-500 hover:text-emerald-600 flex items-center gap-1 transition">
        <i class="fa-regular fa-copy"></i> คัดลอก
      </button>
    </div>

    <div id="content-box" class="min-h-[160px] flex items-center justify-center">
      <div id="loading" class="text-slate-400 text-sm flex items-center gap-2">
        <i class="fa-solid fa-spinner animate-spin"></i> กำลังโหลดข้อมูล...
      </div>
      <div id="rules-text" class="hidden text-slate-700 text-sm whitespace-pre-line leading-relaxed w-full"></div>
    </div>

    <button onclick="shareRules()" class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-bold py-3 rounded-xl shadow-md flex items-center justify-center gap-2 transition">
      <i class="fa-solid fa-share-nodes"></i> แชร์กฎกลุ่มนี้ไปยังแชต
    </button>
  </div>

  <script>
    const API_URL = "ใส่_WEB_APP_URL_ของคุณที่นี่/exec";
    let currentRules = "";

    async function fetchRules() {
      try {
        const res = await fetch(`${API_URL}?action=getRules`);
        const data = await res.json();
        if (data.status === "success") {
          currentRules = data.text || "ยังไม่มีข้อมูลกฎระเบียบ";
          document.getElementById('loading').classList.add('hidden');
          const rulesEl = document.getElementById('rules-text');
          rulesEl.innerText = currentRules;
          rulesEl.classList.remove('hidden');
        }
      } catch (e) {
        document.getElementById('loading').innerHTML = '<span class="text-red-500">ไม่สามารถโหลดข้อมูลได้</span>';
      }
    }

    function copyRules() {
      if (!currentRules) return;
      navigator.clipboard.writeText(currentRules);
      alert("คัดลอกข้อความกฎระเบียบเรียบร้อยแล้ว");
    }

    async function shareRules() {
      if (!liff.isLoggedIn()) { liff.login(); return; }
      if (liff.isApiAvailable('shareTargetPicker')) {
        liff.shareTargetPicker([
          { "type": "text", "text": "📖 ข้อปฏิบัติประจำกลุ่ม:\n\n" + currentRules }
        ]).then(() => liff.closeWindow()).catch(err => console.error(err));
      }
    }

    liff.init({ liffId: "2012072125-RXgWMeiV" }).then(() => fetchRules()).catch(() => fetchRules());
  </script>
</body>
</html>
