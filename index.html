<script>
  // URL สำรองเริ่มต้นสำหรับยิงดึงค่าครั้งแรก
  let API_URL = "https://script.google.com/macros/s/AKfycbzXY82TccpStVNFVncZWFPstctemNwytXPeB3zijnjWFuTRA5oR5oHd9P5nlxln3KjZjQ/exec";

  function showStatus(msg, isError = false, isLoading = false) {
    const banner = document.getElementById('status-banner');
    const icon = document.getElementById('status-icon');
    const message = document.getElementById('status-message');

    banner.classList.remove('hidden');
    message.innerText = msg;

    if (isLoading) {
      icon.className = "fa-solid fa-spinner animate-spin text-sky-600";
      banner.className = "glass-card rounded-2xl p-4 border-l-4 border-sky-500 flex items-center justify-between text-xs";
    } else if (isError) {
      icon.className = "fa-solid fa-triangle-exclamation text-red-500";
      banner.className = "glass-card rounded-2xl p-4 border-l-4 border-red-500 flex items-center justify-between text-xs";
    } else {
      icon.className = "fa-solid fa-circle-check text-emerald-500";
      banner.className = "glass-card rounded-2xl p-4 border-l-4 border-emerald-500 flex items-center justify-between text-xs";
    }
  }

  function updateConnectionBadge(isConnected) {
    const badge = document.getElementById('connection-badge');
    const text = document.getElementById('connection-status-text');
    if (isConnected) {
      badge.className = "flex items-center gap-2 bg-emerald-50 border border-emerald-200 text-emerald-700 px-3 py-1.5 rounded-full text-xs font-medium";
      badge.querySelector('span').className = "w-2 h-2 rounded-full bg-emerald-500 animate-ping";
      text.innerText = "เชื่อมต่อระบบเรียบร้อย";
    } else {
      badge.className = "flex items-center gap-2 bg-red-50 border border-red-200 text-red-600 px-3 py-1.5 rounded-full text-xs font-medium";
      badge.querySelector('span').className = "w-2 h-2 rounded-full bg-red-500";
      text.innerText = "การเชื่อมต่อล้มเหลว";
    }
  }

  function getApiUrl() {
    const input = document.getElementById('app-url-input').value.trim();
    return input || API_URL;
  }

  // 1. ฟังก์ชันดึง URL จากช่อง A1 ของชีท url โดยตรง
  async function loadAppUrlFromSheet() {
    showStatus("กำลังดึง Web App URL จากแผ่นงาน url (A1)...", false, true);
    try {
      const res = await fetch(`${API_URL}?action=getAppUrl`);
      const data = await res.json();
      if (data.status === "success" && data.url) {
        API_URL = data.url;
        document.getElementById('app-url-input').value = data.url;
        showStatus("ดึง URL จากแผ่นงาน url (A1) สำเร็จ");
        return data.url;
      }
    } catch (e) {
      console.error("Error fetching URL from sheet A1", e);
    }
    document.getElementById('app-url-input').value = API_URL;
    return API_URL;
  }

  // 2. ปุ่ม "บันทึก" บันทึก URL ใหม่ลงชีท url (ช่อง A1)
  async function saveAppUrlToSheet() {
    const inputUrl = document.getElementById('app-url-input').value.trim();
    if (!inputUrl) return alert("กรุณากรอก URL ให้ถูกต้อง");
    
    showStatus("กำลังบันทึก URL ลงแผ่นงาน url (A1)...", false, true);
    try {
      const res = await fetch(`${getApiUrl()}?action=updateAppUrl&url=${encodeURIComponent(inputUrl)}`);
      const data = await res.json();
      if (data.status === "success") {
        API_URL = inputUrl;
        showStatus("บันทึก URL ลงแผ่นงาน url (A1) เรียบร้อยแล้ว");
      } else {
        showStatus("บันทึก URL ไม่สำเร็จ: " + data.message, true);
      }
    } catch (e) {
      showStatus("เกิดข้อผิดพลาดในการบันทึก URL", true);
    }
  }

  // 3. ปุ่ม "เชื่อมต่อ" ดึงค่า A1 ใหม่ + โหลดข้อมูลสถิติทั้งหมดมาแสดงผล
  async function connectAndFetchData() {
    showStatus("กำลังดึง URL จาก A1 และเชื่อมต่อระบบ...", false, true);

    try {
      // ดึง URL จาก A1 ก่อน
      await loadAppUrlFromSheet();

      // โหลดข้อมูล Dashboard ทั้งหมด
      await Promise.all([
        fetchAlertText(),
        fetchRulesText(),
        fetchMemberStats(),
        fetchScheduleStatus()
      ]);

      updateConnectionBadge(true);
      showStatus("เชื่อมต่อ และโหลดข้อมูลระบบสำเร็จเรียบร้อย");
    } catch (err) {
      updateConnectionBadge(false);
      showStatus("เชื่อมต่อล้มเหลว ตรวจสอบ Web App URL อีกครั้ง", true);
    }
  }

  async function fetchAlertText() {
    const res = await fetch(`${getApiUrl()}?action=getAlert`);
    const data = await res.json();
    if (data.status === "success") document.getElementById('alert-textarea').value = data.text || "";
  }

  async function fetchRulesText() {
    const res = await fetch(`${getApiUrl()}?action=getRules`);
    const data = await res.json();
    if (data.status === "success") document.getElementById('rules-textarea').value = data.text || "";
  }

  async function fetchMemberStats() {
    const res = await fetch(`${getApiUrl()}?action=getMembers`);
    const data = await res.json();
    if (data.status === "success") {
      document.getElementById('stat-group-count').innerText = `${data.groupCount || 0} กลุ่ม`;
      document.getElementById('stat-user-count').innerText = `${data.userCount || 0} คน`;
    }
  }

  async function fetchScheduleStatus() {
    try {
      const res = await fetch(`${getApiUrl()}?action=getSchedule`);
      const data = await res.json();
      const badge = document.getElementById('schedule-status-badge');
      
      if (data.status === "success" && data.active) {
        badge.className = "text-xs bg-emerald-100 text-emerald-800 border border-emerald-300 px-2.5 py-1 rounded-full font-medium";
        badge.innerText = `เปิดใช้งาน (${data.mode})`;
        if (data.modeKey) document.getElementById('schedule-type-select').value = data.modeKey;
      } else {
        badge.className = "text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full font-medium";
        badge.innerText = "ยังไม่ได้ตั้งเวลา";
      }
    } catch (e) {}
  }

  async function setSchedule() {
    const mode = document.getElementById('schedule-type-select').value;
    showStatus("กำลังตั้งค่าระบบเวลาอัตโนมัติ...", false, true);
    try {
      const res = await fetch(`${getApiUrl()}?action=setSchedule&mode=${mode}`);
      const data = await res.json();
      if (data.status === "success") {
        showStatus(data.message);
        fetchScheduleStatus();
      } else {
        showStatus("ตั้งเวลาไม่สำเร็จ: " + data.message, true);
      }
    } catch (e) {
      showStatus("เกิดข้อผิดพลาดในการตั้งเวลา", true);
    }
  }

  async function cancelSchedule() {
    if (!confirm("คุณต้องการยกเลิกการส่งอัตโนมัติใช่หรือไม่?")) return;
    showStatus("กำลังยกเลิกการตั้งเวลา...", false, true);
    try {
      const res = await fetch(`${getApiUrl()}?action=cancelSchedule`);
      const data = await res.json();
      if (data.status === "success") {
        showStatus(data.message);
        fetchScheduleStatus();
      } else {
        showStatus("ยกเลิกไม่สำเร็จ", true);
      }
    } catch (e) {
      showStatus("เกิดข้อผิดพลาด", true);
    }
  }

  async function saveAlertText() {
    const text = document.getElementById('alert-textarea').value;
    showStatus("กำลังบันทึกข้อความประกาศ...", false, true);
    try {
      const res = await fetch(`${getApiUrl()}?action=updateAlert&text=${encodeURIComponent(text)}`);
      const data = await res.json();
      if (data.status === "success") showStatus("บันทึกข้อความประกาศสำเร็จ");
      else showStatus("บันทึกไม่สำเร็จ", true);
    } catch (e) {
      showStatus("เชื่อมต่อล้มเหลว", true);
    }
  }

  async function saveRulesText() {
    const text = document.getElementById('rules-textarea').value;
    showStatus("กำลังบันทึกกฎข้อบังคับ...", false, true);
    try {
      const res = await fetch(`${getApiUrl()}?action=updateRules&text=${encodeURIComponent(text)}`);
      const data = await res.json();
      if (data.status === "success") showStatus("บันทึกกฎข้อบังคับสำเร็จ");
      else showStatus("บันทึกไม่สำเร็จ", true);
    } catch (e) {
      showStatus("เชื่อมต่อล้มเหลว", true);
    }
  }

  window.onload = async () => {
    await connectAndFetchData();
  };
</script>
