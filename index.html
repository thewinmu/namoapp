<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Namobot Admin Control Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body class="bg-slate-900 min-h-screen text-slate-100 flex flex-col justify-between p-4 md:p-6">

  <div class="max-w-xl mx-auto w-full space-y-6">
    
    <!-- Header -->
    <header class="flex items-center justify-between border-b border-slate-800 pb-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-sky-500/30">
          <i class="fa-solid fa-shield-halved text-white text-lg"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg tracking-wide text-sky-100">Namobot Control</h1>
          <p class="text-xs text-slate-400">Admin Dashboard (PC & Web)</p>
        </div>
      </div>
      <span class="px-3 py-1 bg-sky-500/10 border border-sky-500/30 text-sky-400 text-xs font-semibold rounded-full">Secure Admin</span>
    </header>

    <!-- Stats Grid -->
    <div class="grid grid-cols-2 gap-4">
      <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-4 flex items-center gap-4 shadow-lg">
        <div class="w-12 h-12 rounded-xl bg-sky-500/10 flex items-center justify-center text-sky-400 text-xl">
          <i class="fa-solid fa-user-group"></i>
        </div>
        <div>
          <p class="text-xs text-slate-400 font-medium">กลุ่มทั้งหมด</p>
          <h3 id="stat-groups" class="text-2xl font-bold text-white">0</h3>
        </div>
      </div>

      <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-4 flex items-center gap-4 shadow-lg">
        <div class="w-12 h-12 rounded-xl bg-emerald-500/10 flex items-center justify-center text-emerald-400 text-xl">
          <i class="fa-solid fa-users"></i>
        </div>
        <div>
          <p class="text-xs text-slate-400 font-medium">สมาชิกทั้งหมด</p>
          <h3 id="stat-users" class="text-2xl font-bold text-white">0</h3>
        </div>
      </div>
    </div>

    <!-- Web App URL Config Box -->
    <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-5 space-y-3 shadow-lg">
      <label class="text-xs font-semibold text-slate-300 flex items-center gap-2">
        <i class="fa-solid fa-link text-sky-400"></i> Google Apps Script Web App URL
      </label>
      <div class="flex gap-2">
        <input type="text" id="input-webapp-url" placeholder="https://script.google.com/macros/s/.../exec" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-xs text-slate-200 focus:outline-none focus:border-sky-500 transition">
        <button onclick="saveWebAppUrl()" class="bg-sky-600 hover:bg-sky-500 text-white px-4 py-2 rounded-xl text-xs font-semibold transition active:scale-95 shadow">
          บันทึก
        </button>
      </div>
    </div>

    <!-- Content Management -->
    <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-5 space-y-5 shadow-lg">
      <h2 class="text-sm font-bold text-sky-200 flex items-center gap-2 border-b border-slate-700/60 pb-3">
        <i class="fa-solid fa-pen-to-square text-sky-400"></i> จัดการข้อความประกาศ & ต้อนรับ
      </h2>

      <!-- Alert Message Box -->
      <div class="space-y-2">
        <label class="text-xs text-slate-300 font-medium">1. ข้อความต้อนรับเข้ากลุ่ม (Sheet: alert -> A1)</label>
        <textarea id="input-alert" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-slate-200 focus:outline-none focus:border-sky-500 transition leading-relaxed"></textarea>
        
        <div class="flex gap-2 pt-1">
          <button onclick="updateAlert()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-slate-100 py-2.5 rounded-xl text-xs font-semibold transition active:scale-95 flex items-center justify-center gap-2">
            <i class="fa-solid fa-floppy-disk text-sky-400"></i> บันทึกข้อความต้อนรับ
          </button>
          
          <button onclick="triggerBroadcast()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white py-2.5 rounded-xl text-xs font-semibold transition active:scale-95 flex items-center justify-center gap-2 shadow-lg shadow-emerald-600/20">
            <i class="fa-solid fa-paper-plane"></i> ส่งต้อนรับเข้าทุกกลุ่ม
          </button>
        </div>
      </div>

      <!-- Law / Rules Message Box -->
      <div class="space-y-2 pt-3 border-t border-slate-700/60">
        <label class="text-xs text-slate-300 font-medium">2. ข้อความกฎระเบียบกลุ่ม (Sheet: law -> A1)</label>
        <textarea id="input-rules" rows="4" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-slate-200 focus:outline-none focus:border-sky-500 transition leading-relaxed"></textarea>
        
        <button onclick="updateRules()" class="w-full bg-slate-700 hover:bg-slate-600 text-slate-100 py-2.5 rounded-xl text-xs font-semibold transition active:scale-95 flex items-center justify-center gap-2">
          <i class="fa-solid fa-floppy-disk text-sky-400"></i> บันทึกกฎกลุ่มลง Sheet law
        </button>
      </div>
    </div>

    <!-- Navigation / Preview Links -->
    <div class="grid grid-cols-2 gap-3 pb-6">
      <a href="law.html" target="_blank" class="bg-slate-800 hover:bg-slate-700/80 border border-slate-700 text-slate-200 py-3 px-4 rounded-xl text-xs font-medium text-center transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-book-open text-sky-400"></i> เปิดดู กฏกลุ่ม
      </a>
      <a href="daliycards.html" target="_blank" class="bg-slate-800 hover:bg-slate-700/80 border border-slate-700 text-slate-200 py-3 px-4 rounded-xl text-xs font-medium text-center transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-wand-magic-sparkles text-amber-400"></i> เปิดดู Cards Of the Day
    </div>

  </div>

  <script>
    // ดึงค่า Web App URL จาก LocalStorage หรือใช้ค่าดีฟอลต์
    let API_URL = localStorage.getItem("namo_webapp_url") || "https://script.google.com/macros/s/AKfycbyBz-Fp81B6MBcA0rcr4ZEH-E6Q3kzfvfMamlVnzQsw6YiHXyzmry1uQTJ00v3bhhQWlA/exec";
    document.getElementById('input-webapp-url').value = API_URL;

    function saveWebAppUrl() {
      const val = document.getElementById('input-webapp-url').value.trim();
      if (!val) { alert("กรุณากรอก URL ให้ถูกต้อง"); return; }
      API_URL = val;
      localStorage.setItem("namo_webapp_url", API_URL);
      alert("บันทึก Web App URL เรียบร้อยแล้ว");
      loadDashboardData();
    }

    // โหลดข้อมูลสถิติและข้อความจาก Google Sheets ผ่าน API
    async function loadDashboardData() {
      try {
        // ดึงจำนวนสมาชิก/กลุ่ม
        const resMem = await fetch(`${API_URL}?action=getMembers`);
        const dataMem = await resMem.json();
        if (dataMem.status === "success") {
          document.getElementById('stat-groups').innerText = dataMem.groupCount || 0;
          document.getElementById('stat-users').innerText = dataMem.userCount || 0;
        }

        // ดึงข้อความต้อนรับ (alert)
        const resAlert = await fetch(`${API_URL}?action=getAlert`);
        const dataAlert = await resAlert.json();
        if (dataAlert.status === "success") {
          document.getElementById('input-alert').value = dataAlert.text || "";
        }

        // ดึงกฎระเบียบ (law)
        const resRules = await fetch(`${API_URL}?action=getRules`);
        const dataRules = await resRules.json();
        if (dataRules.status === "success") {
          document.getElementById('input-rules').value = dataRules.text || "";
        }
      } catch (e) {
        console.error("Load data error: ", e);
      }
    }

    // อัปเดตข้อความต้อนรับ
    async function updateAlert() {
      const text = document.getElementById('input-alert').value;
      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams({ action: "updateAlert", text: text })
        });
        const data = await res.json();
        if (data.status === "success") {
          alert("บันทึกข้อความต้อนรับสำเร็จ!");
        } else {
          alert("เกิดข้อผิดพลาด: " + data.message);
        }
      } catch (e) {
        alert("ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้");
      }
    }

    // อัปเดตกฎระเบียบกลุ่ม
    async function updateRules() {
      const text = document.getElementById('input-rules').value;
      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams({ action: "updateRules", text: text })
        });
        const data = await res.json();
        if (data.status === "success") {
          alert("บันทึกกฎระเบียบกลุ่มลง Sheet law สำเร็จ!");
        } else {
          alert("เกิดข้อผิดพลาด: " + data.message);
        }
      } catch (e) {
        alert("ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้");
      }
    }

    // กดปุ่มส่งต้อนรับเข้าทุกกลุ่ม (Broadcast)
    async function triggerBroadcast() {
      if (!confirm("คุณต้องการส่งข้อความต้อนรับพร้อมปุ่มลอย Quick Reply เข้าทุกกลุ่ม LINE ทันทีใช่หรือไม่?")) {
        return;
      }

      // แสดงสถานะกำลังส่ง
      const btn = event.currentTarget;
      const originalHTML = btn.innerHTML;
      btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> กำลังส่ง...`;
      btn.disabled = true;

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams({ action: "triggerSend" })
        });
        const data = await res.json();

        if (data.status === "success") {
          alert("✨ " + data.message);
        } else {
          alert("❌ ส่งไม่สำเร็จ: " + (data.message || "กรุณาตรวจสอบ Group ID ในแผ่นงาน member"));
        }
      } catch (e) {
        alert("เกิดข้อผิดพลาดในการเชื่อมต่อเครือข่าย: " + e.toString());
      } finally {
        btn.innerHTML = originalHTML;
        btn.disabled = false;
      }
    }

    // Initialize LIFF & Load Data
    liff.init({ liffId: "2012072125-T2uPldCc" }).then(() => {
      loadDashboardData();
    }).catch(() => {
      loadDashboardData(); // เผื่อรันผ่านเบสพาวเวอร์ปกติที่ไม่ใช่ LIFF SDK โดยตรง
    });
  </script>
</body>
</html>
