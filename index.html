<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>namobot Admin App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8fafc; font-family: 'Sukhumvit Set', 'Kanit', sans-serif; }
  </style>
</head>
<body class="pb-20 max-w-md mx-auto bg-slate-50 min-h-screen shadow-lg relative">

  <!-- Header -->
  <header class="bg-emerald-600 text-white p-4 sticky top-0 z-50 shadow-md flex items-center justify-between">
    <div class="flex items-center space-x-2">
      <i class="fa-solid fa-robot text-xl"></i>
      <h1 class="font-bold text-lg">namobot Admin</h1>
    </div>
    <span class="bg-emerald-700 text-xs px-2.5 py-1 rounded-full border border-emerald-400">v1.2</span>
  </header>

  <!-- Notification Toast -->
  <div id="toast" class="hidden fixed top-16 left-1/2 -translate-x-1/2 bg-gray-800 text-white text-xs px-4 py-2 rounded-full shadow-xl transition-all duration-300 z-50 flex items-center space-x-2">
    <i id="toast-icon" class="fa-solid fa-circle-info"></i>
    <span id="toast-message">แจ้งเตือน</span>
  </div>

  <!-- Content Container -->
  <main class="p-4 space-y-4">
    
    <!-- URL Configuration Section -->
    <section class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
      <label class="block text-xs font-semibold text-gray-500 mb-1">
        <i class="fa-solid fa-link text-emerald-600 mr-1"></i> Google Apps Script Web App URL
      </label>
      <input type="text" id="scriptUrl" placeholder="https://script.google.com/macros/s/.../exec" 
             class="w-full text-xs p-2.5 border border-gray-200 rounded-lg focus:outline-none focus:border-emerald-500 bg-gray-50 font-mono">
      <button onclick="saveApiUrl()" class="mt-2 w-full bg-slate-800 text-white text-xs py-2 rounded-lg font-medium hover:bg-slate-700 active:scale-[0.98] transition">
        บันทึกการตั้งค่า API URL
      </button>
    </section>

    <!-- Welcome Message Editor -->
    <section class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
      <div class="flex justify-between items-center mb-2">
        <label class="text-sm font-bold text-gray-700 flex items-center">
          <i class="fa-solid fa-pen-to-square text-emerald-600 mr-2"></i> ข้อความต้อนรับกลุ่ม
        </label>
        <button onclick="fetchAlertData()" class="text-xs text-emerald-600 hover:text-emerald-700 font-medium">
          <i class="fa-solid fa-rotate mr-1"></i> ดึงข้อมูล
        </button>
      </div>
      <textarea id="alertTextarea" rows="3" oninput="updatePreview()" 
                class="w-full text-xs p-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500" 
                placeholder="กำลังโหลดข้อมูล..."></textarea>
      
      <div class="mt-3 flex space-x-2">
        <button onclick="saveAlertData()" class="flex-1 bg-emerald-600 text-white text-xs font-bold py-2.5 rounded-lg shadow-sm hover:bg-emerald-700 active:scale-[0.98] transition">
          <i class="fa-solid fa-floppy-disk mr-1"></i> บันทึกลง Sheet
        </button>
        <button onclick="triggerDailyAlert()" class="bg-sky-600 text-white text-xs font-bold px-3 py-2.5 rounded-lg shadow-sm hover:bg-sky-700 active:scale-[0.98] transition">
          <i class="fa-solid fa-paper-plane mr-1"></i> ส่งต้อนรับ
        </button>
      </div>
    </section>

    <!-- Preview Box -->
    <section class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
      <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-3 flex items-center">
        <i class="fa-solid fa-eye text-emerald-600 mr-1.5"></i> ตัวอย่าง Flex Message ต้อนรับ
      </h3>
      <div class="border border-gray-200 rounded-xl overflow-hidden shadow-sm bg-white max-w-[280px] mx-auto">
        <div class="bg-[#06C755] p-2 text-white font-bold text-xs text-center">
          🎉 ยินดีต้อนรับเข้าสู่กลุ่มค่ะ!
        </div>
        <div class="p-3 bg-white text-center">
          <div id="flexPreviewText" class="text-xs font-bold text-gray-800 leading-relaxed whitespace-pre-wrap">
            กำลังรอข้อความ...
          </div>
        </div>
        <div class="p-2.5 bg-[#F7F8FA] border-t border-gray-100 space-y-1.5">
          <div class="bg-[#06C755] text-white text-[11px] font-bold py-1.5 text-center rounded-md">📖 อ่านกฎกลุ่ม</div>
          <div class="bg-[#17A2B8] text-white text-[11px] font-bold py-1.5 text-center rounded-md">🎉 ร่วมกิจกรรม</div>
        </div>
      </div>
    </section>

    <!-- Link to Law.html -->
    <section class="bg-emerald-50 border border-emerald-200 p-3.5 rounded-xl flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-scale-balanced text-emerald-600 text-lg"></i>
        <div>
          <h4 class="text-xs font-bold text-emerald-900">หน้ากฎระเบียบกลุ่ม (Law.html)</h4>
          <p class="text-[10px] text-emerald-600">เปิดดูหน้าเว็บ LIFF กฎกลุ่มเฉพาะกิจ</p>
        </div>
      </div>
      <a href="Law.html" class="bg-emerald-600 text-white text-xs px-3 py-1.5 rounded-lg font-bold shadow hover:bg-emerald-700">
        เปิดดูหน้า
      </a>
    </section>

  </main>

  <script>
    document.getElementById('scriptUrl').value = localStorage.getItem('NAMOBOT_API_URL') || '';

    function showToast(msg, isSuccess = true) {
      const toast = document.getElementById('toast');
      const icon = document.getElementById('toast-icon');
      document.getElementById('toast-message').innerText = msg;
      icon.className = isSuccess ? 'fa-solid fa-circle-check text-emerald-400' : 'fa-solid fa-triangle-exclamation text-rose-400';
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 3000);
    }

    function saveApiUrl() {
      const url = document.getElementById('scriptUrl').value.trim();
      if(!url) return showToast('กรุณากรอก Web App URL', false);
      localStorage.setItem('NAMOBOT_API_URL', url);
      showToast('บันทึก API URL เรียบร้อย');
      fetchAlertData();
    }

    function getApiUrl() {
      return localStorage.getItem('NAMOBOT_API_URL');
    }

    function updatePreview() {
      const text = document.getElementById('alertTextarea').value;
      document.getElementById('flexPreviewText').innerText = text || 'ไม่มีข้อความแสดงผล';
    }

    async function fetchAlertData() {
      const apiUrl = getApiUrl();
      if(!apiUrl) return;

      try {
        const res = await fetch(`${apiUrl}?action=getAlert`);
        const data = await res.json();
        if(data.status === 'success') {
          document.getElementById('alertTextarea').value = data.text;
          updatePreview();
        }
      } catch(e) {
        showToast('โหลดข้อมูลไม่สำเร็จ', false);
      }
    }

    async function saveAlertData() {
      const apiUrl = getApiUrl();
      if(!apiUrl) return showToast('กรุณาตั้งค่า API URL ก่อน', false);

      const text = document.getElementById('alertTextarea').value;
      try {
        const res = await fetch(apiUrl, {
          method: 'POST',
          body: JSON.stringify({ action: 'updateAlert', text: text })
        });
        const data = await res.json();
        if(data.status === 'success') showToast('บันทึกข้อมูลเรียบร้อยแล้ว');
      } catch(e) {
        showToast('บันทึกข้อมูลไม่สำเร็จ', false);
      }
    }

    async function triggerDailyAlert() {
      const apiUrl = getApiUrl();
      if(!apiUrl) return showToast('กรุณาตั้งค่า API URL ก่อน', false);

      showToast('กำลังส่งข้อความ...');
      try {
        const res = await fetch(apiUrl, {
          method: 'POST',
          body: JSON.stringify({ action: 'triggerSend' })
        });
        const data = await res.json();
        if(data.status === 'success') showToast('ส่งข้อความสำเร็จแล้ว');
        else showToast('ส่งไม่สำเร็จ: ' + data.message, false);
      } catch(e) {
        showToast('ส่งไม่สำเร็จ ตรวจสอบโควตา LINE', false);
      }
    }

    if(getApiUrl()) fetchAlertData();
  </script>
</body>
</html>
