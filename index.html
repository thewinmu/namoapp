<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>namobot Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8fafc; font-family: 'Sukhumvit Set', 'Kanit', sans-serif; }
  </style>
</head>
<body class="pb-20 max-w-md mx-auto bg-slate-50 min-h-screen shadow-lg relative">

  <!-- Header Admin -->
  <header class="bg-indigo-600 text-white p-4 sticky top-0 z-50 shadow-md flex items-center justify-between">
    <div class="flex items-center space-x-2">
      <i class="fa-solid fa-sliders text-xl"></i>
      <h1 class="font-bold text-lg">namobot Admin Control</h1>
    </div>
    <span class="bg-indigo-700 text-xs px-2.5 py-1 rounded-full border border-indigo-400 font-mono">PC & Web</span>
  </header>

  <!-- Notification Toast -->
  <div id="toast" class="hidden fixed top-16 left-1/2 -translate-x-1/2 bg-gray-800 text-white text-xs px-4 py-2 rounded-full shadow-xl z-50 flex items-center space-x-2">
    <i id="toast-icon" class="fa-solid fa-circle-info"></i>
    <span id="toast-message">แจ้งเตือน</span>
  </div>

  <main class="p-4 space-y-4">

    <!-- Stats Overview -->
    <div class="grid grid-cols-2 gap-3">
      <div class="bg-white p-3.5 rounded-xl shadow-sm border border-gray-100 flex items-center space-x-3">
        <div class="w-9 h-9 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center">
          <i class="fa-solid fa-user-group text-sm"></i>
        </div>
        <div>
          <p class="text-[10px] text-gray-400 font-medium">กลุ่มทั้งหมด</p>
          <h4 id="groupCount" class="text-sm font-bold text-gray-800">-</h4>
        </div>
      </div>
      <div class="bg-white p-3.5 rounded-xl shadow-sm border border-gray-100 flex items-center space-x-3">
        <div class="w-9 h-9 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center">
          <i class="fa-solid fa-users text-sm"></i>
        </div>
        <div>
          <p class="text-[10px] text-gray-400 font-medium">สมาชิกทั้งหมด</p>
          <h4 id="userCount" class="text-sm font-bold text-gray-800">-</h4>
        </div>
      </div>
    </div>

    <!-- API Config -->
    <section class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
      <label class="block text-xs font-semibold text-gray-500 mb-1">
        <i class="fa-solid fa-link text-indigo-600 mr-1"></i> Google Apps Script Web App URL
      </label>
      <input type="text" id="scriptUrl" placeholder="https://script.google.com/macros/s/.../exec" 
             class="w-full text-xs p-2.5 border border-gray-200 rounded-lg focus:outline-none focus:border-indigo-500 bg-gray-50 font-mono">
      <div class="flex space-x-2 mt-2">
        <button onclick="saveApiUrl()" class="flex-1 bg-slate-800 text-white text-xs py-2 rounded-lg font-medium hover:bg-slate-700 transition">
          บันทึก URL
        </button>
        <button onclick="fetchDashboardData()" class="bg-indigo-50 text-indigo-600 px-3 text-xs py-2 rounded-lg font-bold border border-indigo-200 hover:bg-indigo-100 transition">
          <i class="fa-solid fa-rotate mr-1"></i> รีเฟรช
        </button>
      </div>
    </section>

    <!-- Admin Form: Edit Welcome & Rules Text -->
    <section class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 space-y-4">
      <h3 class="text-xs font-bold text-gray-700 flex items-center border-b pb-2">
        <i class="fa-solid fa-pen-to-square text-indigo-600 mr-1.5"></i> แก้ไขเนื้อหาตาราง Google Sheets
      </h3>

      <!-- Edit Welcome Message -->
      <div>
        <label class="block text-[11px] font-medium text-gray-600 mb-1">
          1. ข้อความต้อนรับเข้ากลุ่ม <span class="text-gray-400">(Sheet: alert -> A1)</span>
        </label>
        <textarea id="alertTextarea" rows="3" class="w-full text-xs p-2.5 border border-gray-200 rounded-lg focus:ring-1 focus:ring-indigo-500" placeholder="กำลังโหลด..."></textarea>
        <div class="flex space-x-2 mt-1.5">
          <button onclick="saveAlertData()" class="flex-1 bg-indigo-600 text-white text-xs font-bold py-2 rounded-lg hover:bg-indigo-700 transition">
            <i class="fa-solid fa-floppy-disk mr-1"></i> บันทึกข้อความต้อนรับ
          </button>
          <button onclick="triggerBroadcastAlert()" class="bg-emerald-600 text-white text-xs font-bold px-3 py-2 rounded-lg hover:bg-emerald-700 transition">
            <i class="fa-solid fa-paper-plane mr-1"></i> ส่งต้อนรับเข้าทุกกลุ่ม
          </button>
        </div>
      </div>

      <!-- Edit Group Rules -->
      <div>
        <label class="block text-[11px] font-medium text-gray-600 mb-1">
          2. ข้อความกฎระเบียบกลุ่ม <span class="text-gray-400">(Sheet: law -> A1)</span>
        </label>
        <textarea id="rulesTextarea" rows="5" class="w-full text-xs p-2.5 border border-gray-200 rounded-lg focus:ring-1 focus:ring-indigo-500" placeholder="กำลังโหลด..."></textarea>
        <button onclick="saveRulesData()" class="mt-1.5 w-full bg-indigo-600 text-white text-xs font-bold py-2 rounded-lg hover:bg-indigo-700 transition">
          <i class="fa-solid fa-floppy-disk mr-1"></i> บันทึกกฎกลุ่มลง Sheet law
        </button>
      </div>
    </section>

    <!-- Test View Law Page -->
    <a href="law.html" target="_blank" class="block bg-emerald-50 border border-emerald-200 p-3 rounded-xl text-center text-xs font-bold text-emerald-700 hover:bg-emerald-100 transition">
      <i class="fa-solid fa-eye mr-1"></i> เปิดดูตัวอย่างหน้าเว็บ Law.html (หน้าสมาชิก)
    </a>

  </main>

  <script>
    const DEFAULT_API_URL = "https://script.google.com/macros/s/AKfycbwv8AaKJKJDkQGncaNPhz/exec";

    document.addEventListener("DOMContentLoaded", function() {
      document.getElementById('scriptUrl').value = localStorage.getItem('NAMOBOT_API_URL') || DEFAULT_API_URL;
      fetchDashboardData();
    });

    function showToast(msg, isSuccess = true) {
      const toast = document.getElementById('toast');
      const icon = document.getElementById('toast-icon');
      document.getElementById('toast-message').innerText = msg;
      icon.className = isSuccess ? 'fa-solid fa-circle-check text-emerald-400' : 'fa-solid fa-triangle-exclamation text-rose-400';
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 3000);
    }

    function getApiUrl() { return localStorage.getItem('NAMOBOT_API_URL') || DEFAULT_API_URL; }

    function saveApiUrl() {
      const url = document.getElementById('scriptUrl').value.trim();
      if(!url) return showToast('กรุณากรอก Web App URL', false);
      localStorage.setItem('NAMOBOT_API_URL', url);
      showToast('บันทึก URL เรียบร้อย');
      fetchDashboardData();
    }

    async function fetchDashboardData() {
      const apiUrl = getApiUrl();
      if(!apiUrl) return;

      // ดึงข้อความต้อนรับ
      try {
        const res = await fetch(`${apiUrl}?action=getAlert`);
        const data = await res.json();
        if(data.status === 'success') document.getElementById('alertTextarea').value = data.text;
      } catch(e){}

      // ดึงกฎกลุ่ม
      try {
        const res = await fetch(`${apiUrl}?action=getRules`);
        const data = await res.json();
        if(data.status === 'success') document.getElementById('rulesTextarea').value = data.text;
      } catch(e){}

      // ดึงสถิติมนุษย์/กลุ่ม
      try {
        const res = await fetch(`${apiUrl}?action=getMembers`);
        const data = await res.json();
        if(data.status === 'success') {
          document.getElementById('groupCount').innerText = data.groupCount || 0;
          document.getElementById('userCount').innerText = data.userCount || 0;
        }
      } catch(e){}
    }

    async function saveAlertData() {
      const text = document.getElementById('alertTextarea').value;
      try {
        const res = await fetch(getApiUrl(), {
          method: 'POST',
          body: JSON.stringify({ action: 'updateAlert', text: text })
        });
        const data = await res.json();
        if(data.status === 'success') showToast('บันทึกข้อความต้อนรับแล้ว');
      } catch(e) { showToast('บันทึกไม่สำเร็จ', false); }
    }

    async function saveRulesData() {
      const text = document.getElementById('rulesTextarea').value;
      try {
        const res = await fetch(getApiUrl(), {
          method: 'POST',
          body: JSON.stringify({ action: 'updateRules', text: text })
        });
        const data = await res.json();
        if(data.status === 'success') showToast('บันทึกกฎกลุ่มลง Sheet law เรียบร้อย');
      } catch(e) { showToast('บันทึกไม่สำเร็จ', false); }
    }

    async function triggerBroadcastAlert() {
      if(!confirm("ต้องการส่งข้อความต้อนรับไปยังกลุ่มทั้งหมดใช่หรือไม่?")) return;
      showToast('กำลังส่งข้อความเข้าทุกกลุ่ม...');
      try {
        const res = await fetch(getApiUrl(), {
          method: 'POST',
          body: JSON.stringify({ action: 'triggerSend' })
        });
        const data = await res.json();
        if(data.status === 'success') showToast('ส่งเข้าทุกกลุ่มเรียบร้อย');
        else showToast('ส่งไม่สำเร็จ: ' + data.message, false);
      } catch(e) { showToast('เกิดข้อผิดพลาดในการส่ง', false); }
    }
  </script>
</body>
</html>
